server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: users-auth
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
            - id: users
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**
            - id: products
              uri: http://localhost:8082
              predicates:
                - Path=/api/products/**
            - id: orders
              uri: http://localhost:8083
              predicates:
                - Path=/api/orders/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
